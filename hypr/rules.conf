# Hyprland 0.53+ window rule syntax (windowrulev2 was removed in 0.56)
# https://wiki.hypr.land/Configuring/Basics/Window-Rules/

windowrule = tile on, match:class ^(steam)$
windowrule = stay_focused on, match:title ^()$, match:class ^(steam)$
windowrule = min_size 1 1, match:title ^()$, match:class ^(steam)$
# windowrule = float on, match:title ^()$, match:class ^(steam)$
windowrule = idle_inhibit fullscreen, match:class .*

# Unity Hub
windowrule = float on, match:class ^(unityhub)$
windowrule = center on, match:class ^(unityhub)$
windowrule = size 1200 800, match:class ^(unityhub)$

# Unity Editor popups float
windowrule = float on, match:class ^(Unity)$, match:title ^(Unity.*Hub)$
windowrule = float on, match:class ^(Unity)$, match:title ^(Unity License.*)$
windowrule = float on, match:class ^(Unity)$, match:title ^(Importing.*)$
windowrule = center on, match:class ^(Unity)$, match:title ^(Unity.*Hub)$

# stop tooltip/dropdown focus steal
windowrule = no_focus on, match:class ^(Unity)$, match:title ^$
windowrule = no_initial_focus on, match:class ^(Unity)$, match:title ^(.*dropdown.*)$

# kill blur glitches (opaque removed - transparency set in looknfeel.conf)
windowrule = no_blur on, match:class ^(Unity)$
windowrule = no_shadow on, match:class ^(Unity)$

# fix zero-size splash
windowrule = min_size 1 1, match:class ^(Unity)$
