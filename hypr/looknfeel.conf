# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 8
    gaps_out = 16
    border_size = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
# Use round window corners
        rounding = 36
        active_opacity = 1.0
        inactive_opacity = 1.0

        blur {
                size = 8
        }

        # Soft, wide, low-opacity drop shadow - macOS window elevation
        shadow {
                enabled = true
                range = 20
                render_power = 3
                color = rgba(00000059)
                offset = 0 6
        }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    single_window_aspect_ratio = 16 9
    # single_window_aspect_ratio_tolerance = 0.21
}

animations {
    enabled = true
    animation = workspaces, 1, 4, easeOutQuint, slidefade
}

dwindle {
        preserve_split = false
}

plugin:hyprglass {
    enabled = true
    default_theme = dark

    # No presets on purpose: every value here is the live one. Edit and save,
    # Hyprland auto-reloads and the plugin repaints instantly.
    # (A `default_preset` would silently override most of these.)

    # material
    glass_opacity = 1.2
    blur_strength = 0.8
    blur_iterations = 4
    tint_color = 0xffffff00

    # edge curvature: band width is edge_thickness * shorter window side;
    # refraction_strength * 50 = px of inward pull. Keep them in proportion.
    edge_thickness = 0.008
    refraction_strength = 3.2
    chromatic_aberration = 0.4
    fresnel_strength = 1.0
    lens_distortion = 4.0

    # tone
    brightness = 1.1
    contrast = 1.33
    saturation = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
    # dims only bright backdrops - the text legibility knob
    adaptive_dim = 0.0
    adaptive_boost = 0.0

    layers {
        enabled = 1
        # Only the DP-5 bar. The rotated DP-7 gets namespace "plainbar" instead,
        # because this layer pass isn't transform-aware and loses the bar there.
        namespaces = waybar, walker
    }
}
# Uniform whole-window transparency. Window rules beat decoration:active_opacity,
# and Omarchy pins several groups at near-opaque values in apps.conf
# (terminal 0.985/0.96, browsers 1.0/0.985), so each group needs its own override
# or it stays opaque.
windowrule = opacity 0.88 0.82, match:tag default-opacity
windowrule = opacity 0.88 0.72, match:tag terminal
windowrule = opacity 0.88 0.82, match:tag firefox-based-browser
windowrule = opacity 0.88 0.82, match:tag chromium-based-browser

# Omarchy pins steam and Unity at opacity 1 via class rules, and neither has a
# tag of its own, so define the tags here before overriding.
windowrule = tag +steam, match:class steam.*
windowrule = tag -default-opacity, match:tag steam
windowrule = opacity 0.72 0.62, match:tag steam

windowrule = tag +unity, match:class ^(Unity|unityhub)$
windowrule = tag -default-opacity, match:tag unity
windowrule = opacity 0.88 0.82, match:tag unity
