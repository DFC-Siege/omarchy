# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 8
    gaps_out = 16
    border_size = 4
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
# Use round window corners
        rounding = 36
        active_opacity = 0.9
        inactive_opacity = 0.82

        blur {
                size = 8
        }

        # Soft, wide, low-opacity drop shadow - macOS window elevation
        shadow {
                enabled = true
                range = 40
                render_power = 3
                color = rgba(00000059)
                offset = 0 6
        }
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    single_window_aspect_ratio = 16 9
    # single_window_aspect_ratio_tolerance = 0.21
}

animations {
    enabled = true
    animation = workspaces, 1, 4, easeOutQuint, slidefade
}

dwindle {
        preserve_split = false
}

plugin:hyprglass {
    enabled = true
    default_theme = dark
    default_preset = liquid
    # Apple dark material base: rgb(28,28,30) at low alpha
    tint_color = 0x1c1c1e1a

    # <1.0 lets some unblurred background through - reads as real glass
    glass_opacity = 0.85
    # Low enough that background shapes stay recognizable
    blur_strength = 1.4
    blur_iterations = 3
    # Narrow bezel + strong squeeze inside it = Apple's tight edge lens
    # ~20px hairline band on a big window - Apple's lens is tight
    edge_thickness = 0.015
    refraction_strength = 0.55
    chromatic_aberration = 0.15
    # Apple keeps the interior flat, no magnification
    lens_distortion = 0.0
    fresnel_strength = 1.2
    specular_strength = 1.8
    saturation = 1.05
    vibrancy = 0.5
    contrast = 1.02

    dark:brightness = 0.95
    dark:vibrancy_darkness = 0.35
    dark:adaptive_dim = 0.25
    light:brightness = 1.12
    light:adaptive_boost = 0.45

    preset = name:liquid, inherits:glass, glass_opacity:0.85, blur_strength:1.4, blur_iterations:3, edge_thickness:0.015, refraction_strength:0.55, chromatic_aberration:0.15, lens_distortion:0.0, fresnel_strength:1.2, specular_strength:1.8, saturation:1.05, vibrancy:0.5, contrast:1.02, tint_color:0x1c1c1e1a
    preset = name:liquid:dark, brightness:0.95, vibrancy_darkness:0.35, adaptive_dim:0.25
    preset = name:liquid:light, brightness:1.12, adaptive_boost:0.45

    # Bars/panels: bezel is a fraction of the SHORT side, so a thin bar needs a big value
    preset = name:bar, inherits:glass, glass_opacity:1.0, blur_strength:3.4, blur_iterations:4, edge_thickness:0.5, refraction_strength:0.35, chromatic_aberration:0.15, lens_distortion:0.0, fresnel_strength:0.7, specular_strength:1.2, saturation:0.95, vibrancy:0.45, tint_color:0x1c1c1e4d
    preset = name:bar:dark, brightness:0.7, adaptive_dim:0.5, vibrancy_darkness:0.3

    preset = name:contrasted, inherits:high_contrast, contrast:1.2, adaptive_dim:1.5
    preset = name:contrasted:dark, tint_color:0x02142aa9

    layers {
        # OFF: layer glass discards every fragment on rotated outputs (DP-9 is
        # transform 3), which makes waybar vanish there. Gain was ~nil anyway.
        enabled = 0
        namespaces = waybar, swaync, quickshell:bezel
        exclude_namespaces = debug-panel
        preset = bar
        namespace_presets = quickshell:bezel:liquid
        namespace_mask_thresholds = waybar=0.05, quickshell:bezel=0.3
    }
}

# Omarchy's windows.conf tags every window with default-opacity and applies
# `opacity 0.985 0.96`, which overrides decoration:active_opacity. Override it.
# Terminals stay at window opacity 1.0 - their own background_opacity does the
# transparency, so glyphs render fully opaque and stay crisp.
windowrule = opacity 0.9 0.82, match:tag default-opacity
windowrule = opacity 1.0 1.0, match:class ^(kitty|com\.mitchellh\.ghostty|Alacritty)$
