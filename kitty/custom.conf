font_size        12.0
symbol_map U+3000-U+30FF,U+4E00-U+9FFF Noto Sans Mono CJK JP
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Transparent background so hyprglass shows through. Text/glyphs stay fully
# opaque, so legibility is unaffected - unlike window-level opacity.
background_opacity 0.42
dynamic_background_opacity yes
